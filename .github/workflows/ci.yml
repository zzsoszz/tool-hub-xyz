name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'

permissions:
  contents: read

jobs:
  test:
    name: 测试与离线构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run lint
      - run: npm test
      - name: 离线样例走完整流水线
        run: |
          node src/collect.mjs --offline --out=.ci/data
          DATA_DIR=.ci/data DIST_DIR=.ci/dist node src/build.mjs

      # 全站样式只有 public/styles.css 一份，设计规则在这里最容易破例。
      # dist/ 里引用上游正文的措辞不归本站改，所以闸门只扫本站资产。
      - name: 设计质量闸门（Impeccable 62 条确定性规则）
        run: npx --yes impeccable@4.10.0 detect --github public
